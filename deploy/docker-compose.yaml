# Reference copy of the host's docker-compose.yaml for the weather website
# (lives at /docker/apps/wetter-strudengau/ on 192.168.178.95).
#
# Installed by deploy-web.sh on the FIRST deploy only (when the host has no
# docker-compose.yaml yet). Afterwards the host copy is left alone — it may
# carry hand-edits; push changes deliberately with `deploy-web.sh --update-stack`.
#
# Secrets live in git-ignored env files beside this one, NOT committed:
#   .env          compose-level only – ${VAR} substitution (the tunnel token)
#   .env.bridge   wetter-bridge only (MQTT credentials)
# One file per service, so a compromised container cannot read the other's secrets.
#
# No top-level `version:` — Compose v2 ignores it and warns on every command.

services:
  # Static site + caching proxy to Open-Meteo (/api/om/*) + bridge JSON (/api/ha/*).
  # The site is a static Next.js export: every deploy replaces ./html in place.
  wetter-strudengau:
    image: nginx:stable-alpine
    container_name: wetter-strudengau
    ports:
      - "8883:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./changelog:/usr/share/nginx/changelog:ro   # deploy-changelog.sh, beside the build
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./om-proxy.inc:/etc/nginx/om-proxy.inc:ro
      - om-cache:/var/cache/nginx/om          # proxy cache survives container recreation
    restart: unless-stopped

  # Home Assistant integration: MQTT discovery (devices + sensors per station) and
  # /api/ha/<station>.json. Stateless, no database. Reaches Open-Meteo through the
  # nginx cache above, and Mosquitto via the host's published port (see .env.bridge).
  wetter-bridge:
    build: ./bridge
    image: wetter-bridge:local
    container_name: wetter-bridge
    env_file:
      - path: ./.env.bridge
        required: false                       # without it: JSON endpoints only, no MQTT
    environment:
      OM_BASE: http://wetter-strudengau/api/om
    depends_on:
      - wetter-strudengau
    restart: unless-stopped
    expose:
      - "3000"

  # Cloudflare tunnel for the public hostname. Remotely-managed (token) tunnel:
  # the ingress rule lives in the Cloudflare dashboard, not in a local config.
  #
  # In the dashboard, point the tunnel's public hostname at
  #   http://wetter-strudengau:80      (compose network, survives a host-IP change)
  # or http://192.168.178.95:8883 (LAN address – the current setup for
  # https://wetter.softwarekstatt.at).
  #
  # Use a hostname ONE label under your zone (e.g. wetter.<your-domain>):
  # Cloudflare's free Universal SSL covers only <zone> and *.<zone>.
  #
  # Started only when .env holds a token (compose profile `tunnel`).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wetter-strudengau-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:-missing}
    depends_on:
      - wetter-strudengau
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  om-cache:
