# Reference copy of the host's nginx.conf for the weather website
# (lives at /docker/apps/wetter-strudengau/ on the server).
#
#   /            static Next.js export (out/ → html/)
#   /api/om/*    caching proxy to the Open-Meteo APIs – all visitors (and the
#                Home Assistant bridge) share one cache, so many visitors cost
#                about as many API calls as one, and the free limit is protected
#   /api/ha/*    JSON state of the Home Assistant bridge (wetter-bridge service)
#   /changelog/  release notes, served from a directory beside html/ (deploy-changelog.sh)

# ---------------------------------------------------------------- caching proxy
proxy_cache_path /var/cache/nginx/om levels=1:2 keys_zone=om:20m max_size=1g inactive=30d use_temp_path=off;

# Persistent TLS connections to Open-Meteo: a fresh handshake per request occasionally
# timed out (seen in practice) and costs latency.
upstream om_forecast  { server api.open-meteo.com:443;           keepalive 8; }
upstream om_archive   { server archive-api.open-meteo.com:443;   keepalive 4; }
upstream om_geocoding { server geocoding-api.open-meteo.com:443; keepalive 2; }

# Cache policy for the browser per path. Set via one server-level add_header: a
# location with its own add_header would silently drop the server-level headers.
map $uri $wetter_cache_control {
    ~^/_next/static/   "public, max-age=31536000, immutable";  # content-hashed build output
    ~^/api/            "no-store";                             # the proxy caches, not the browser
    default            "no-cache";                             # HTML: always revalidate (cheap 304)
}

# Public release notes may be read from anywhere (e.g. a dev server on localhost).
# An empty value sends no header.
map $uri $wetter_cors {
    ~^/changelog/      "*";
    default            "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $wetter_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Location access is requested by the page itself (nearest station).
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Access-Control-Allow-Origin $wetter_cors always;

    # Static export: /auswertung → auswertung.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # PWA manifest: nginx's stock mime.types has no .webmanifest entry, and with
    # nosniff the browser must get the right type. Scoped here – a server-level
    # types{} would replace every other MIME type. No add_header in this block,
    # so the server-level headers still apply.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # --- Open-Meteo, same-origin and cached --------------------------------------
    # Exact-match locations: the query string is passed on unchanged.
    # proxy_cache_valid = how long an answer is reused:
    location = /api/om/forecast {
        proxy_pass https://om_forecast/v1/forecast;
        proxy_set_header Host api.open-meteo.com;
        proxy_ssl_name api.open-meteo.com;
        proxy_cache_valid 200 60s;      # current values change every 15 min; 1 min keeps the tracker live
        include /etc/nginx/om-proxy.inc;
    }
    location = /api/om/archive {
        proxy_pass https://om_archive/v1/archive;
        proxy_set_header Host archive-api.open-meteo.com;
        proxy_ssl_name archive-api.open-meteo.com;
        proxy_cache_valid 200 12h;      # reanalysis – changes at most daily
        include /etc/nginx/om-proxy.inc;
    }
    location = /api/om/geocoding {
        proxy_pass https://om_geocoding/v1/search;
        proxy_set_header Host geocoding-api.open-meteo.com;
        proxy_ssl_name geocoding-api.open-meteo.com;
        proxy_cache_valid 200 7d;       # place names
        include /etc/nginx/om-proxy.inc;
    }

    # --- Changelog (deploy/changelog/) – not part of the build -----------------
    location /changelog/ {
        alias /usr/share/nginx/changelog/;
        default_type application/json;
    }

    # --- Home Assistant bridge state (JSON) -------------------------------------
    # Resolved at request time via Docker's DNS, so nginx still starts while the
    # bridge container is absent or restarting.
    location /api/ha/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $bridge wetter-bridge:3000;
        rewrite ^/api/ha/(.*)$ /$1 break;
        proxy_pass http://$bridge;
        proxy_set_header Host $host;
        # the bridge may be down/not deployed yet – don't let that break the site
        proxy_intercept_errors on;
        error_page 502 503 504 = @bridge_down;
    }
    location @bridge_down {
        default_type application/json;
        return 503 '{"error":"bridge not running"}';
    }

    error_page 404 /404.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
