# Reference copy of the host's nginx.conf for the weather website
# (lives at /docker/apps/wetter-strudengau/ on the server).
# Serves the static Next.js export (out/ → html/).

# Cache policy per path. Set via one server-level add_header: a location with its
# own add_header would silently drop every server-level header (security headers).
map $uri $wetter_cache_control {
    # content-hashed build output – new build, new file names → cache forever
    ~^/_next/static/   "public, max-age=31536000, immutable";
    # HTML and everything else – always revalidate (cheap 304 via ETag),
    # so a deploy is visible immediately, also through Cloudflare
    default            "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $wetter_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Location access is requested by the page itself (nearest station).
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Static export: /auswertung → auswertung.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
